apiVersion: 1

contactPoints:
  - orgId: 1
    name: ntfy-push
    receivers:
      - uid: ntfy-webhook
        type: webhook
        settings:
          url: http://ntfy:80/pand-alerts
          httpMethod: POST

policies:
  - orgId: 1
    receiver: ntfy-push
    group_by: ["alertname", "pand_project"]

groups:
  - orgId: 1
    name: pand-box-alerts
    folder: Pand
    interval: 1m
    rules:
      - uid: disk_high
        title: Box Disk Usage > 80%
        condition: C
        for: 5m
        data:
          - refId: C
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: '100 - ((node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100) > 80'
      - uid: ram_low
        title: Available RAM < 600MB
        condition: C
        for: 5m
        data:
          - refId: C
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: "(node_memory_MemAvailable_bytes / 1024 / 1024) < 600"
      - uid: backup_stale
        title: R2 Nightly Backup Age > 28h
        condition: C
        for: 5m
        data:
          - refId: C
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: "((time() - pand_backup_last_success_timestamp_seconds) / 3600) > 28"
